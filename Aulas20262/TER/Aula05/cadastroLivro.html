<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livraria</title>
  </head>

  <body>
    <h1>Cadastro de Livro</h1>

    <form action="cadastroLivro" method="post" enctype="multipart/form-data">
      <fieldset>
        <legend>DADOS DO LIVRO</legend>

        <p><label for="titulo">TÍTULO:</label><br>
          <input type="text" id="titulo" name="titulo" size="30" autofocus>
        </p>

        <p><label for="ano">ANO:</label><br>
          <input type="text" id="ano" name="ano" size="5">
        </p>        

        <p><input type="submit" value="Cadastrar Livro"></p>
      </fieldset>
    </form>
  </body>
</html>
